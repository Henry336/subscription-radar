<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subscription Leak Radar</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Subscription Leak Radar</h1>
        <p>Local-first recurring charge review from pasted transactions or CSV files.</p>
      </div>
      <div class="privacy">No bank login &middot; no upload &middot; browser only</div>
    </header>

    <main>
      <section class="panel input-panel" aria-labelledby="input-title">
        <div class="section-title">
          <h2 id="input-title">Transactions</h2>
          <div class="actions">
            <label class="file-button">
              Import CSV
              <input id="csv-file" type="file" accept=".csv,text/csv">
            </label>
            <button id="load-sample" type="button">Load sample</button>
            <button id="analyze" class="primary" type="button">Analyze</button>
          </div>
        </div>
        <textarea id="transaction-input" spellcheck="false" placeholder="Paste CSV rows with Date, Description, Amount columns. Negative amounts are treated as spending; refunds and credits are ignored."></textarea>
        <p id="parse-status" class="status">0 transactions parsed.</p>
        <div id="import-review" class="import-review" aria-live="polite"></div>
      </section>

      <section id="summary" class="summary" aria-label="Analysis summary"></section>

      <section class="grid">
        <div class="panel">
          <div class="section-title">
            <h2>Recurring candidates</h2>
            <button id="export-plan" class="primary" type="button" disabled>Export plan</button>
          </div>
          <div id="findings" class="stack"></div>
          <div id="suppressed" class="stack"></div>
        </div>
        <aside class="side-rail">
          <section class="panel">
            <h2>Renewal timeline</h2>
            <div id="renewals" class="stack compact"></div>
          </section>
          <section class="panel">
            <h2>Duplicate risks</h2>
            <div id="duplicates" class="stack compact"></div>
          </section>
        </aside>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
